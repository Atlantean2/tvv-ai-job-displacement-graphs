<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures AI Job Displacement Graphs — labor</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#labor")</script></head><body><main id="issue"><h2 class="desk">Labor Market Reality</h2><p>What the official US labor data show today: openings vs layoffs, jobless claims, long-term unemployment vs quits, and temp help as an early signal.</p><figure class="g"><img src="img/labor-05.webp" alt="Openings per layoff" loading="lazy"><figcaption><span class="t">Openings per layoff.</span> BLS JOLTS (August 2026): 7.08M job openings vs 1.64M layoffs and discharges, 4.3 openings per layoff (2019 average 3.9; 2000-26 average 3.1). Layoffs were 1.83M a year earlier; the post-2021 high was 1.90M (Mar 2023). Grey bands = NBER recessions. [Data. Data: 2026-08 (monthly JOLTS; September JOLTS not yet in FRED file)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/JTSLDL" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/JTSLDL</a> <a href="https://fred.stlouisfed.org/series/JTSJOL" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/JTSJOL</a> <a href="https://www.bls.gov/jlt/" target="_blank" rel="noopener">https://www.bls.gov/jlt/</a></span></figcaption></figure><figure class="g"><img src="img/labor-06.webp" alt="Claims back at 2019 levels" loading="lazy"><figcaption><span class="t">Claims back at 2019 levels.</span> DOL (via FRED): 1.701M continuing claims in the week to Oct 17 (1.953M a year earlier; 2019 average 1.68M) vs initial claims of 194K in the week to Oct 24 (2019 average 218K). Continuing claims are 13% below a year ago and within 1% of the 2019 average: no sign yet in UI data of the broad AI-driven layoff wave that is feared; claims count only insured workers. [Data. Data: 2026-10-24 (initial); 2026-10-17 (continuing); DOL release Thu Oct 29]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CCSA" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CCSA</a> <a href="https://fred.stlouisfed.org/series/ICSA" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/ICSA</a> <a href="https://www.dol.gov/ui/data.pdf" target="_blank" rel="noopener">https://www.dol.gov/ui/data.pdf</a></span></figcaption></figure><figure class="g"><img src="img/labor-07.webp" alt="Long-term unemployment vs quits" loading="lazy"><figcaption><span class="t">Long-term unemployment vs quits.</span> BLS CPS unemployed 27 weeks and over (FRED UEMP27OV) 1.94M = 27.3% of all unemployed (UNEMPLOY 7.11M) in Sep 2026; 2019 average 21.1%. JOLTS quits rate 1.9% (Aug 2026; September JOLTS not yet in FRED). Low quits plus longer job searches = a &#x27;low-hire, low-fire&#x27; market that is hard for job losers and graduates. Jobs/Labor series. [Data. Data: 2026-09 (CPS); JOLTS 2026-08]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/UEMP27OV" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/UEMP27OV</a> <a href="https://fred.stlouisfed.org/series/UNEMPLOY" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/UNEMPLOY</a> <a href="https://fred.stlouisfed.org/series/JTSQUR" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/JTSQUR</a></span></figcaption></figure><figure class="g"><img src="img/labor-08.webp" alt="Temp help jobs slide" loading="lazy"><figcaption><span class="t">Temp help jobs slide.</span> BLS CES temporary help services (FRED TEMPHELPS) 2.487M in Sep 2026, 21.3% below its Mar 2022 peak of 3.161M; total nonfarm payrolls 159.0M. Share of payrolls 1.56%, lowest since May 2020. Employers usually cut temps before permanent staff. Jobs/Labor series. [Data. Data: 2026-09 (BLS Employment Situation)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/TEMPHELPS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/TEMPHELPS</a> <a href="https://fred.stlouisfed.org/series/PAYEMS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/PAYEMS</a> <a href="https://www.bls.gov/ces/" target="_blank" rel="noopener">https://www.bls.gov/ces/</a></span></figcaption></figure></main></body></html>
