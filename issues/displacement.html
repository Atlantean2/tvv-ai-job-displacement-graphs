<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures AI Job Displacement Graphs — displacement</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#displacement")</script></head><body><main id="issue"><h2 class="desk">Displacement Risk</h2><p>Where AI is expected to touch work, and where early pressure shows up: published exposure estimates, entry-level graduates, tech-services jobs and software job postings.</p><figure class="g"><img src="img/displacement-01.webp" alt="AI exposure vs displacement" loading="lazy"><figcaption><span class="t">AI exposure vs displacement.</span> Published estimates, not forecasts by TVV. IMF (Jan 2024 SDN/2024/001): ~40% of global employment exposed to AI, ~60% in advanced economies, 40% emerging markets, 26% low-income. ILO-NASK (May 2025, WP140): 25% of global employment in an occupation with some GenAI exposure, 34% in high-income vs 11% in low-income countries, 3.3% in the highest-exposure gradient. Goldman Sachs (Aug 2025): 6-7% of the US workforce displaced if AI is widely adopted (range 3-14%), mostly transitory. Exposure includes augmentation, so it is not a job-loss count. Jobs/Labor series. [Data. Data: 2025-08 (latest of the cited studies)]<br><span class="s">Source: <a href="https://www.imf.org/en/Blogs/Articles/2024/01/14/ai-will-transform-the-global-economy-lets-make-sure-it-benefits-humanity" target="_blank" rel="noopener">https://www.imf.org/en/Blogs/Articles/2024/01/14/ai-will-transform-the-global-economy-lets-make-sure-it-benefits-humanity</a> <a href="https://www.ilo.org/resource/news/one-four-jobs-risk-being-transformed-genai-new-ilo%E2%80%93nask-global-index-shows" target="_blank" rel="noopener">https://www.ilo.org/resource/news/one-four-jobs-risk-being-transformed-genai-new-ilo%E2%80%93nask-global-index-shows</a> <a href="https://www.ilo.org/sites/default/files/2025-05/WP140_web.pdf" target="_blank" rel="noopener">https://www.ilo.org/sites/default/files/2025-05/WP140_web.pdf</a> <a href="https://www.goldmansachs.com/insights/articles/how-will-ai-affect-the-global-workforce" target="_blank" rel="noopener">https://www.goldmansachs.com/insights/articles/how-will-ai-affect-the-global-workforce</a></span></figcaption></figure><figure class="g"><img src="img/displacement-02.webp" alt="Entry-level squeeze" loading="lazy"><figcaption><span class="t">Entry-level squeeze.</span> BLS (CPS via FRED, not seasonally adjusted for the degree series): bachelor&#x27;s-degree holders aged 20-24 had 7.6% unemployment in September 2026 vs 4.2% for all workers and 2.5% for bachelor&#x27;s holders 25+. On 12-month averages (removing the school-year seasonality) the young-grad gap is +2.6 pp (pre-2020 high +1.7 pp). Entry-level white-collar hiring is where AI substitution is expected to show first, but this series does not isolate AI as a cause. [Data. Data: 2026-09 (monthly CPS; Sep jobs report)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CGBD2024" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CGBD2024</a> <a href="https://fred.stlouisfed.org/series/CGBD25O" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CGBD25O</a> <a href="https://fred.stlouisfed.org/series/UNRATE" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/UNRATE</a> <a href="https://www.bls.gov/cps/" target="_blank" rel="noopener">https://www.bls.gov/cps/</a></span></figcaption></figure><figure class="g"><img src="img/displacement-03.webp" alt="Tech jobs lag the economy" loading="lazy"><figcaption><span class="t">Tech jobs lag the economy.</span> BLS payroll survey (September 2026): computer systems design &amp; related services employed 2.36M (-5.2% vs its Mar 2023 peak); information sector 2.74M; total payrolls 159.0M. Both tech-heavy series lag total payrolls since 2022; rate hikes, post-pandemic over-hiring and AI coding tools all overlap, so the chart shows exposure, not proof of AI-caused job loss. [Data. Data: 2026-09 (monthly CES; Sep jobs report)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CES6054150001" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CES6054150001</a> <a href="https://fred.stlouisfed.org/series/USINFO" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/USINFO</a> <a href="https://fred.stlouisfed.org/series/PAYEMS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/PAYEMS</a> <a href="https://www.bls.gov/ces/" target="_blank" rel="noopener">https://www.bls.gov/ces/</a></span></figcaption></figure><figure class="g"><img src="img/displacement-04.webp" alt="Hosting vs IT services jobs" loading="lazy"><figcaption><span class="t">Hosting vs IT services jobs.</span> BLS CES (FRED): computing infrastructure, data processing and web hosting (CES5051800001) 453.8K jobs in Sep 2026, -4.7% y/y, index 102.9 vs Jan 2022; computer systems design (CES6054150001) 2,355K, -1.3% y/y. Despite record data-center construction, hosting/data-processing payrolls are not growing: the build-out&#x27;s jobs show up in construction and power, not in operating the facilities. Jobs/Labor series. [Data. Data: 2026-09 (BLS Employment Situation)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/CES5051800001" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CES5051800001</a> <a href="https://fred.stlouisfed.org/series/CES6054150001" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/CES6054150001</a> <a href="https://fred.stlouisfed.org/series/PAYEMS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/PAYEMS</a></span></figcaption></figure><figure class="g"><img src="img/displacement-05.webp" alt="Software jobs still far below 2020" loading="lazy"><figcaption><span class="t">Software jobs still far below 2020.</span> Indeed Hiring Lab (FRED IHLIDXUSTPSOFTDEVE, IHLIDXUS), Oct 23: software development postings index 80.8 (Feb 1, 2020 = 100; +23.8% y/y), down 65% from 233.8 on Feb 28, 2022; all postings 103.7 (+3.1% y/y). The gap is consistent with AI coding tools plus post-2022 tech cutbacks, though the past year shows a partial rebound; postings measure hiring demand, not layoffs. Jobs/Labor series. [Data. Data: 2026-10-23 (Indeed via FRED, daily)]<br><span class="s">Source: <a href="https://fred.stlouisfed.org/series/IHLIDXUSTPSOFTDEVE" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/IHLIDXUSTPSOFTDEVE</a> <a href="https://fred.stlouisfed.org/series/IHLIDXUS" target="_blank" rel="noopener">https://fred.stlouisfed.org/series/IHLIDXUS</a> <a href="https://data.indeed.com/" target="_blank" rel="noopener">https://data.indeed.com/</a></span></figcaption></figure><figure class="g"><img src="img/displacement-15.webp" alt="Developers aged 22–25: jobs index down 18.6% since Nov 2022" loading="lazy"><figcaption><span class="t">Developers aged 22–25: jobs index down 18.6% since Nov 2022.</span> Sep 2026: developers aged 22–25 at 81.4, aged 41–49 at 120.2 (Nov 2022=100). Stanford Canaries, ADP. [Data. Data: Sep 2026 (vintage Oct 16, published Oct 21, 2026)]<br><span class="s">Source: <a href="https://digitaleconomy.stanford.edu/project/indicators/canaries-dashboard/" target="_blank" rel="noopener">https://digitaleconomy.stanford.edu/project/indicators/canaries-dashboard/</a> <a href="https://storage.googleapis.com/aviary-del-public/release_memos/latest/downloads/canaries_software_developers_results.zip" target="_blank" rel="noopener">https://storage.googleapis.com/aviary-del-public/release_memos/latest/downloads/canaries_software_developers_results.zip</a> <a href="https://storage.googleapis.com/aviary-del-public/release_memos/latest/downloads/canaries_by_age_results.zip" target="_blank" rel="noopener">https://storage.googleapis.com/aviary-del-public/release_memos/latest/downloads/canaries_by_age_results.zip</a> <a href="https://digitaleconomy.stanford.edu/app/uploads/2026/08/Canaries_August2026.pdf" target="_blank" rel="noopener">https://digitaleconomy.stanford.edu/app/uploads/2026/08/Canaries_August2026.pdf</a> <a href="https://budgetlab.yale.edu/research/evaluating-impact-ai-labor-market-current-state-affairs" target="_blank" rel="noopener">https://budgetlab.yale.edu/research/evaluating-impact-ai-labor-market-current-state-affairs</a> <a href="https://x.com/randgroup/status/2120088546350428535" target="_blank" rel="noopener">https://x.com/randgroup/status/2120088546350428535</a></span> <p class="doubt">Rand’s headline says “1 in 5 junior dev jobs gone since ChatGPT.” Stanford says the dashboard shows correlation, not a causal link, and that earlier declines are likely non-AI. The fixed firm panel leaves out new firms, and the index tracks fewer young hires, not jobs destroyed. All six age series also jump together in May 2025, which may be a sample effect.</p><p>Rebuttal: <a href="https://budgetlab.yale.edu/research/evaluating-impact-ai-labor-market-current-state-affairs">Yale Budget Lab: Evaluating the impact of AI on the labor market</a></p></figcaption></figure></main></body></html>
